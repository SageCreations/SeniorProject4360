<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Team Prototype</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Set a fixed height for the chat area and enable scrolling */
        .chat-box {
            height: 89vh;
            overflow-y: auto;
            background-color: #f8f9fa;
	  		padding: 15px;
			white-space: pre-wrap;
        }
        .message {
          margin-bottom: 15px;
        }
      </style>
</head>
<body>
	<div class="container py-1">
    	<div class="card">
	      	<!-- Chat header -->
      		<div class="card-header">
	        	Document Assistant
	      	</div>
	      	<!-- Chat messages container -->
	      	<div class="card-body chat-box" id="chatBox">
				<!-- chat messages will be inserted here -->
	      	</div>
	      	<!-- Input area for new messages -->
	      	<div class="card-footer">
	        	<div class="input-group">
	          		<input id="chatInput" type="text" class="form-control" placeholder="Type a message">
	          		<button id="chatBtn" class="btn btn-primary" type="button" onclick="handleQuery();">Send</button>
        		</div>
	        </div>
		</div>
	</div>



    <script src="webui.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="static/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
