<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Team Prototype</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="static/css/styles.css"/>
</head>
<body>
	<div class="container py-1">
    	<div class="card">
	      	<!-- Chat header -->
      		<div class="card-header">
	        	Document Assistant
	      	</div>
	      	<!-- Chat messages container -->
	      	<div class="card-body chat-box" id="chatBox">
				<!-- chat messages will be inserted here -->
	      	</div>

			<!-- Input area for new messages -->
	      	<div class="card-footer">
	        	<!-- Slide out file preview panel -->
        		<div id="filePreview"></div>

				<div class="input-group">
					<!-- User input message input -->
					<input id="chatInput" type="text" class="form-control" placeholder="Type a message">

					<!-- Hidden file input -->
    				<input type="file" id="fileInput" accept="image/png, image/jpeg, application/pdf" style="display:none;" multiple>
					<!-- Upload doc button -->
					<button id="docBtn" class="btn btn-light mx-2 border rounded-1" type="button">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-text" viewBox="0 0 16 16">
						  <path d="M5 4a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1zm-.5 2.5A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5M5 8a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1z"/>
						  <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1"/>
						</svg>
					</button>
					<!-- Send button -->
	          		<button id="chatBtn" class="btn btn-primary" type="button" onclick="handleQuery();">Send</button>

        		</div>
	        </div>
		</div>
	</div>



    <script src="webui.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="static/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
